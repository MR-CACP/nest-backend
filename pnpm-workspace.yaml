# 依赖构建脚本白名单（有意的供应链策略）：@scarf/scarf 为依赖遥测采集，显式禁用；
# bcrypt 为原生模块，postinstall 负责下载/编译 prebuilt 二进制（Node 密码哈希用）
allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  bcrypt: true
  unrs-resolver: true

# 依赖覆盖（pnpm 12 起不再读 package.json 的 pnpm 字段，必须写在这里）：
# @nestjs/platform-express 11.2.5 锁定 multer 2.2.0，存在 3 高危+1 低危漏洞（见 pnpm audit），
# 强制提升到 2.3+（API 兼容）；升级 Nest 主版本到自带 multer 2.3+ 的 release 后移除
overrides:
  multer: ^2.3.0
