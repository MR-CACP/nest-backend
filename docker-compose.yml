# 开发基础设施编排：只起 PostgreSQL + Redis，应用本身在宿主机 pnpm start:dev 运行
# （热重载走宿主机工具链更顺手；生产整栈编排见 docker/docker-compose.prod.yml）
#
# 用法：docker compose up -d          # 变量默认值与根目录 .env 中开发凭证一致
#       docker compose down           # 停止；数据卷保留
#       docker compose down -v        # 连数据卷一起删除（慎用）
#
# 凭证从项目根 .env 读取（DB_USERNAME/DB_PASSWORD/DB_DATABASE/REDIS_PASSWORD…），
# 应用与容器共用同一份配置，不存在两套真相源。

name: nest-backend-dev

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: nest-backend-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-nest_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pg_dev_password}
      POSTGRES_DB: ${DB_DATABASE:-nest_dev}
      # 容器与 timestamptz 写入统一用 UTC，避免本地时区污染数据
      TZ: UTC
      PGTZ: UTC
    ports:
      # 仅绑定本机回环：开发凭证可预测，绑 0.0.0.0 在共享网络上会被意外访问；
      # 需远程调试时显式改为 '${DB_PORT:-5432}:5432'
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    volumes:
      # postgres:18+ 官方镜像要求挂载父目录 /var/lib/postgresql（数据落在版本子目录
      # /var/lib/postgresql/18/docker，见 docker-library/postgres#1259）；挂载
      # /var/lib/postgresql/data 会被 entrypoint 判定为"未使用的挂载"而拒绝启动
      - postgres-data:/var/lib/postgresql
      # 首次初始化（空数据卷）时执行：额外创建 e2e 用的 nest_test 库
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ 为 compose 转义，实际在容器内展开 $POSTGRES_USER
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [backend]

  redis:
    image: redis:8.10.1-alpine
    container_name: nest-backend-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
    # shell 形式以便引用环境变量；AOF 开启，重启不丢缓存/限速数据
    command:
      [
        'sh',
        '-c',
        'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes',
      ]
    ports:
      # 同上：仅本机回环，避免 Redis 裸暴露在共享网络
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [backend]

volumes:
  postgres-data:
  redis-data:

networks:
  backend:
    driver: bridge
